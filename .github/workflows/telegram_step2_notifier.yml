name: STEP 2 Top 5 Telegram Alert

on:
  schedule:
    - cron: '45 3 * * 1-5'  # 9:15 AM IST
    - cron: '5 4 * * 1-5'   # 9:35 AM IST
  workflow_dispatch:

jobs:
  telegram_alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping dependency install."
          fi

      - name: Test Telegram connectivity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Missing Telegram secrets")
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": "GitHub Actions Telegram test ✅",
          }
          r = requests.post(url, data=payload, timeout=20)
          print("STATUS:", r.status_code)
          print("BODY:", r.text)
          PY

      - name: Run STEP 2 screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python screener.py

      - name: Send Telegram success notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Missing Telegram secrets")
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": "✅ STEP 2 workflow completed successfully.",
              "parse_mode": "HTML",
          }

          r = requests.post(url, data=payload, timeout=20)
          print("STATUS:", r.status_code)
          print("BODY:", r.text)
          PY

      - name: Confirm run
        if: success()
        run: |
          echo "STEP 2 screener executed successfully."
